[build]
  command = "cd frontend && npm install && npm run build"
  publish = "frontend/dist"

[build.environment]
  NODE_VERSION = "20"

[functions]
  node_bundler = "esbuild"

# SPA catch-all (function paths take precedence automatically)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
